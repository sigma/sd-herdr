<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE — sd-herdr button face (issue #4)</title>
<!--
  THROWAWAY PROTOTYPE — sd-herdr issue #4, "What does the button face look like across its states?"

  Four variants of the 72x72 Stream Deck key face, switchable via ?variant= and the
  floating bottom bar. Variants disagree about STRUCTURE, not palette:

    A  Colour field   - full-bleed state colour, big count numeral. (the abstract design)
    B  Glyph-first    - constant dark ground, state carried by SHAPE, colour redundant.
    C  Name-first     - the workspace label is the content; colour demoted to a bar.
    D  Dot roster     - no numeral at all; one pip per waiting agent, coloured per tier.

  Every variant renders at TRUE 72x72 (the real key bitmap size). The controls simulate
  the conditions the ticket actually asks about: peripheral vision (blur), glance-length
  exposure, colour vision deficiency, and the tile sitting among 14 neighbours on a deck.

  No build step. Open the file. State is in memory. Nothing here ships.
-->
<style>
  :root {
    --bg: #16181d; --panel: #1e2128; --line: #2e323c;
    --fg: #e6e8ec; --dim: #8b919e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 24px 110px; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
  }
  h1 { font-size: 16px; margin: 0 0 4px; font-weight: 650; }
  .sub { color: var(--dim); margin: 0 0 20px; max-width: 68ch; }
  .sub code { color: var(--fg); }

  .controls {
    display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 22px;
  }
  .controls label { display: flex; gap: 7px; align-items: center; color: var(--dim); white-space: nowrap; }
  .controls input[type=range] { width: 96px; }
  .controls button {
    font: inherit; background: #2a2e37; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 11px; cursor: pointer;
  }
  .controls button:hover { background: #343945; }

  table { border-collapse: collapse; width: 100%; max-width: 940px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 0 0 8px; font-size: 12px; }
  td { border-top: 1px solid var(--line); padding: 14px 10px 14px 0; vertical-align: middle; }
  td.scen { width: 300px; }
  .scen b { display: block; font-weight: 600; }
  .scen span { color: var(--dim); font-size: 12px; }
  tr.fixture td { background: #1b2030; }
  .tag {
    display: inline-block; font-size: 10px; letter-spacing: .04em; text-transform: uppercase;
    background: #2f3a58; color: #a9c1ff; border-radius: 4px; padding: 1px 6px; margin-left: 6px;
  }

  .tiles { display: flex; gap: 26px; align-items: center; }
  .tilewrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .tilewrap small { color: var(--dim); font-size: 11px; }
  .key {
    border-radius: 8px; overflow: hidden; display: block;
    box-shadow: 0 0 0 1px #000, 0 2px 6px rgba(0,0,0,.5);
    image-rendering: pixelated;
  }

  .deck {
    display: grid; grid-template-columns: repeat(5, 72px); gap: 12px;
    background: #0c0d10; padding: 16px; border-radius: 12px; width: max-content;
    border: 1px solid var(--line); margin-bottom: 24px;
  }
  .deck .slot { width: 72px; height: 72px; }
  .neighbour { width: 72px; height: 72px; border-radius: 8px; background: #191b20;
    display: flex; align-items: center; justify-content: center; color: #454a55; font-size: 11px;
    box-shadow: 0 0 0 1px #000; }

  #glance {
    position: fixed; inset: 0; background: var(--bg); display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 20px; z-index: 40;
  }
  #glance .hint { color: var(--dim); }

  .switcher {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px; z-index: 50;
    background: #f2f3f5; color: #111; border-radius: 999px; padding: 6px 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.55);
  }
  .switcher button {
    font: inherit; border: 0; background: transparent; cursor: pointer;
    font-size: 16px; line-height: 1; padding: 6px 10px; border-radius: 999px; color: #111;
  }
  .switcher button:hover { background: #dcdee3; }
  .switcher .label { font-weight: 600; padding: 0 8px; white-space: nowrap; }
  .switcher .note { color: #6b7280; font-weight: 400; }
</style>
</head>
<body>

<h1>sd-herdr button face — <span id="vtitle"></span></h1>
<p class="sub">
  Every tile below is drawn at the real key bitmap size, <code>72&times;72</code>. The row shaded blue is the
  snapshot captured during charting: one <code>blocked</code> (trunk), one <code>working</code>, four
  <code>idle</code> &rarr; an attention set of exactly one. Cycle variants with <code>&larr;</code>/<code>&rarr;</code>.
</p>

<div class="controls">
  <label>zoom
    <select id="zoom">
      <option value="1" selected>1&times; (true size)</option>
      <option value="2">2&times;</option>
      <option value="4">4&times;</option>
    </select>
  </label>
  <label>peripheral blur
    <input type="range" id="blur" min="0" max="6" step="0.5" value="0">
    <span id="blurv" style="width:2.5em">0px</span>
  </label>
  <label>session
    <input type="text" id="session" value="default" size="10" spellcheck="false"
      style="font:inherit;background:#2a2e37;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px">
  </label>
  <label><input type="checkbox" id="cvd"> deuteranopia</label>
  <label><input type="checkbox" id="gray"> greyscale</label>
  <label><input type="checkbox" id="deckctx" checked> deck context</label>
  <button id="glanceBtn">glance test (200&nbsp;ms)</button>
</div>

<div id="deckHost"></div>
<table id="grid"></table>

<div id="glance"><div id="glanceHost"></div><div class="hint">what did you read? &mdash; press any key to close</div></div>

<div class="switcher">
  <button id="prev" aria-label="previous variant">&larr;</button>
  <span class="label"><span id="vkey"></span> <span class="note" id="vname"></span></span>
  <button id="next" aria-label="next variant">&rarr;</button>
</div>

<svg width="0" height="0" style="position:absolute">
  <filter id="deuter" color-interpolation-filters="linearRGB">
    <feColorMatrix type="matrix" values="
      0.625 0.375 0 0 0
      0.700 0.300 0 0 0
      0     0.300 0.700 0 0
      0     0     0     1 0"/>
  </filter>
</svg>

<script>
/* ---------------------------------------------------------------- palette */
const C = {
  blocked:  '#C62828',   // red   - any blocked agent
  done:     '#E8A317',   // amber - done only
  clear:    '#101216',   // dark  - nothing wants you
  unseen:   '#33363D',   // grey  - cannot see the session
  slash:    '#6C7079',
  ink:      '#FFFFFF',
  inkDim:   '#767B85',
};

/* ------------------------------------------------------- scenarios (data)
   Each is what the settled attention model would produce from a snapshot.
   tier: 'blocked' | 'done' | 'clear' | 'unseen'
   agents: priority-ordered [{status, workspace}]                            */
const ws = ['trunk','playpen','nix','api','docs','infra','web','cli','db','ops','ml','edge'];
const mk = (status, n, from = 0) =>
  Array.from({length: n}, (_, i) => ({status, workspace: ws[(from + i) % ws.length]}));

const SCENARIOS = [
  { id:'b1',   fixture:true, tier:'blocked', label:'1 blocked',
    note:'the charting fixture — trunk blocked, one working, four idle', agents: mk('blocked',1) },
  { id:'b3',   tier:'blocked', label:'3 blocked', note:'trunk, playpen, nix', agents: mk('blocked',3) },
  { id:'b12',  tier:'blocked', label:'12 blocked', note:'the two-digit case', agents: mk('blocked',12) },
  { id:'mix',  tier:'blocked', label:'1 blocked + 2 done',
    note:'red wins — but does the count mean "blocked" or "attention"?',
    agents: [...mk('blocked',1), ...mk('done',2,1)] },
  { id:'d1',   tier:'done', label:'1 done', note:'playpen finished', agents: mk('done',1,1) },
  { id:'d3',   tier:'done', label:'3 done', note:'', agents: mk('done',3,1) },
  { id:'d12',  tier:'done', label:'12 done', note:'', agents: mk('done',12,1) },
  { id:'ok',   tier:'clear', label:'clear', note:'everything idle or working — press still raises the window', agents: [] },
  { id:'gone', tier:'unseen', label:'cannot see the session',
    note:'socket unreachable, or the session is not running — one state, not two', agents: [] },
];

const bg = t => t === 'blocked' ? C.blocked : t === 'done' ? C.done : t === 'clear' ? C.clear : C.unseen;

/* ------------------------------------------------------------ svg helpers */
const svg = inner =>
  `<svg class="key" viewBox="0 0 72 72" width="72" height="72" xmlns="http://www.w3.org/2000/svg">
     <defs><clipPath id="r"><rect width="72" height="72" rx="8"/></clipPath></defs>
     <g clip-path="url(#r)">${inner}</g></svg>`;
const rect = f => `<rect width="72" height="72" fill="${f}"/>`;
const slash = () =>
  `<path d="M14 58 L58 14" stroke="${C.slash}" stroke-width="7" stroke-linecap="round"/>`;
const txt = (s, {x=36, y=36, size=40, fill=C.ink, weight=700, anchor='middle'}={}) =>
  `<text x="${x}" y="${y}" fill="${fill}" font-size="${size}" font-weight="${weight}"
     text-anchor="${anchor}" dominant-baseline="central"
     font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif">${s}</text>`;
// crude but adequate width fit for a short workspace label
const fit = (s, box = 62, max = 22) => Math.min(max, Math.floor(box / (s.length * 0.58)));
// A row of tier-coloured pips for the OTHER waiting agents — the named one is
// never a pip. Past PIP_CAP the row stops counting and just says "more":
// the exact number past a few is not readable at a glance and not actionable.
// The colour bar doubles as the tile's nameplate, carrying the SESSION name —
// the per-button setting, and the only thing that differs between two buttons.
// At a glance it is the state; on inspection it says which session. Ink flips
// for contrast on amber; the name shrinks rather than clipping.
let SESSION = 'default';
const bar = (fill, ink, label = SESSION) => {
  const size = Math.min(9, Math.floor(66 / (label.length * 0.52)));
  return `<rect width="72" height="13" fill="${fill}"/>` +
  `<text x="36" y="7" fill="${ink}" font-size="${size}" font-weight="700" letter-spacing="0.4"
     text-anchor="middle" dominant-baseline="central"
     font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif">${label}</text>`;
};
const tierBar = t =>
  t === 'done'   ? bar(C.done, '#2a1e00')
: t === 'blocked'? bar(C.blocked, 'rgba(255,255,255,.92)')
  // Cannot see the session: naming it would assert something unverified, so the
  // plate falls back to identifying the button itself.
: t === 'unseen' ? bar(C.unseen, '#9aa0aa', 'herdr')
:                  bar('#23262c', '#666c78');

const PIP_CAP = 4;
const pipRow = (agents, y) => {
  const n = agents.length;
  if (!n) return '';
  const shown = agents.slice(0, PIP_CAP), more = n > PIP_CAP;
  const r = 4, gap = 11, ell = 13;
  const width = (shown.length - 1) * gap + (more ? ell : 0);
  const cx0 = 36 - width / 2;
  const pips = shown.map((a, i) =>
    `<circle cx="${cx0 + i * gap}" cy="${y}" r="${r}"
       fill="${a.status === 'blocked' ? C.blocked : C.done}"/>`).join('');
  const tail = more
    ? txt('…', {x: cx0 + (shown.length - 1) * gap + ell, y: y - 2, size: 18, fill: C.inkDim})
    : '';
  return pips + tail;
};

/* ---------------------------------------------------------------- variants */
const VARIANTS = {

  /* A — colour field: state is the whole tile, count is the content. */
  A: { name: 'Colour field + count', render(s) {
    if (s.tier === 'unseen') return svg(rect(C.unseen) + slash());
    if (s.tier === 'clear')  return svg(rect(C.clear) + `<circle cx="36" cy="36" r="4" fill="${C.inkDim}"/>`);
    const n = s.agents.length;
    return svg(rect(bg(s.tier)) + txt(n, {size: n > 9 ? 38 : 46, fill: s.tier === 'done' ? '#241a00' : C.ink}));
  }},

  /* B — glyph-first: constant dark ground, SHAPE carries the state, colour is
         redundant reinforcement. Count demoted to a corner badge. */
  B: { name: 'Glyph-first (shape carries it)', render(s) {
    const ground = rect('#101216');
    let glyph;
    if (s.tier === 'blocked')
      // octagon = stop / waiting on you
      glyph = `<path d="M28 15 h16 l13 13 v16 l-13 13 h-16 l-13 -13 v-16 z"
                 fill="none" stroke="${C.blocked}" stroke-width="7" stroke-linejoin="round"/>`;
    else if (s.tier === 'done')
      glyph = `<path d="M19 37 l12 12 l22 -26" fill="none" stroke="${C.done}"
                 stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`;
    else if (s.tier === 'clear')
      glyph = `<circle cx="36" cy="36" r="9" fill="none" stroke="${C.inkDim}" stroke-width="3"/>`;
    else
      glyph = `<circle cx="36" cy="36" r="17" fill="none" stroke="${C.slash}" stroke-width="6"/>
               <path d="M24 48 L48 24" stroke="${C.slash}" stroke-width="6" stroke-linecap="round"/>`;
    const n = s.agents.length;
    const badge = n > 1
      ? `<rect x="44" y="2" width="26" height="20" rx="10" fill="#000" opacity=".85"/>` +
        txt(n, {x: 57, y: 12, size: 14, fill: C.ink})
      : '';
    return svg(ground + glyph + badge);
  }},

  /* C — name-first: the workspace label is the content; colour demoted to a
         bar. Answers the deferred "should the tile name the agent" question,
         including the ugly case where it names 1 of 3. */
  C: { name: 'Name-first (workspace label)', render(s) {
    const bar = `<rect width="72" height="10" fill="${bg(s.tier === 'clear' ? 'clear' : s.tier)}"/>`;
    if (s.tier === 'unseen')
      return svg(rect('#101216') + `<rect width="72" height="10" fill="${C.unseen}"/>` +
        txt('no', {y: 34, size: 17, fill: C.slash}) + txt('session', {y: 52, size: 15, fill: C.slash}));
    if (s.tier === 'clear')
      return svg(rect('#101216') + `<rect width="72" height="10" fill="#23262c"/>` +
        txt('clear', {y: 42, size: 16, fill: C.inkDim}));
    const top = s.agents[0].workspace;
    const more = s.agents.length - 1;
    return svg(
      rect('#101216') + bar +
      txt(top, {y: more ? 36 : 42, size: fit(top)}) +
      (more ? txt(`+${more} more`, {y: 57, size: 13, fill: C.inkDim}) : '')
    );
  }},

  /* D — dot roster: no numeral. One pip per waiting agent, coloured per tier,
         priority order. Coarser than a count, honest about multiplicity. */
  D: { name: 'Dot roster (no numeral)', render(s) {
    if (s.tier === 'unseen') return svg(rect('#101216') + slash());
    if (s.tier === 'clear')
      return svg(rect('#101216') + `<circle cx="36" cy="36" r="3" fill="#2c3038"/>`);
    const cap = 9;
    const shown = s.agents.slice(0, cap);
    const overflow = s.agents.length - shown.length;
    const cols = shown.length <= 3 ? shown.length : shown.length <= 6 ? 3 : 3;
    const rows = Math.ceil(shown.length / cols);
    const gap = 20, r = 7;
    const x0 = 36 - ((cols - 1) * gap) / 2, y0 = 36 - ((rows - 1) * gap) / 2 - (overflow ? 6 : 0);
    const pips = shown.map((a, i) => {
      const cx = x0 + (i % cols) * gap, cy = y0 + Math.floor(i / cols) * gap;
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${a.status === 'blocked' ? C.blocked : C.done}"/>`;
    }).join('');
    const plus = overflow ? txt(`+${overflow}`, {y: 63, size: 13, fill: C.inkDim}) : '';
    return svg(rect('#101216') + pips + plus);
  }},
  /* E — C+D hybrid: name the top agent, and render THE REST as pips instead of
         "+N more". The pips are tier-coloured, so a glance reads both "who" and
         "how many else, and how bad". */
  E: { name: 'Name + pips for the rest', render(s) {
    if (s.tier === 'unseen')
      return svg(rect('#101216') + tierBar('unseen') +
        txt('no', {y: 36, size: 17, fill: C.slash}) + txt('session', {y: 54, size: 15, fill: C.slash}));
    if (s.tier === 'clear')
      return svg(rect('#101216') + tierBar('clear') +
        txt('clear', {y: 44, size: 16, fill: C.inkDim}));
    const top = s.agents[0], rest = s.agents.slice(1);
    return svg(
      rect('#101216') + tierBar(s.tier) +
      txt(top.workspace, {y: rest.length ? 38 : 44, size: fit(top.workspace)}) +
      pipRow(rest, 59)
    );
  }},

};
const KEYS = Object.keys(VARIANTS);

/* -------------------------------------------------------------- rendering */
const $ = id => document.getElementById(id);
let variant = (new URLSearchParams(location.search).get('variant') || 'A').toUpperCase();
if (!KEYS.includes(variant)) variant = 'A';

function filterCSS() {
  const f = [];
  const b = parseFloat($('blur').value);
  if (b) f.push(`blur(${b}px)`);
  if ($('gray').checked) f.push('grayscale(1)');
  if ($('cvd').checked) f.push('url(#deuter)');
  return f.join(' ');
}

function applyFX() {
  const css = filterCSS();
  document.querySelectorAll('.key, .neighbour').forEach(e => e.style.filter = css);
  $('blurv').textContent = $('blur').value + 'px';
}

function tile(scen, scale) {
  const html = VARIANTS[variant].render(scen);
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  const el = wrap.firstElementChild;
  el.setAttribute('width', 72 * scale);
  el.setAttribute('height', 72 * scale);
  return el;
}

function render() {
  const scale = +$('zoom').value;
  $('vtitle').textContent = `${variant} — ${VARIANTS[variant].name}`;
  $('vkey').textContent = variant;
  $('vname').textContent = '— ' + VARIANTS[variant].name;

  // deck context: the tile among neighbours, which is how it is actually seen
  const host = $('deckHost');
  host.innerHTML = '';
  if ($('deckctx').checked) {
    const deck = document.createElement('div');
    deck.className = 'deck';
    const labels = ['mute','vol+','vol-','rec','tmux','', 'zoom','slack','pause','next','cam','mic','obs','tea','lock'];
    labels.forEach((l, i) => {
      const slot = document.createElement('div');
      slot.className = 'slot';
      if (i === 5) slot.appendChild(tile(SCENARIOS[0], 1));
      else { const n = document.createElement('div'); n.className = 'neighbour'; n.textContent = l; slot.appendChild(n); }
      deck.appendChild(slot);
    });
    const cap = document.createElement('p');
    cap.className = 'sub';
    cap.style.margin = '0 0 6px';
    cap.textContent = 'Deck context — the fixture tile (1 blocked) sitting in row 2, among ordinary keys.';
    host.append(cap, deck);
  }

  const t = $('grid');
  t.innerHTML = '<tr><th>scenario</th><th>tile</th></tr>';
  for (const s of SCENARIOS) {
    const tr = document.createElement('tr');
    if (s.fixture) tr.className = 'fixture';
    const td1 = document.createElement('td');
    td1.className = 'scen';
    td1.innerHTML = `<b>${s.label}${s.fixture ? '<span class="tag">fixture</span>' : ''}</b><span>${s.note || '&nbsp;'}</span>`;
    const td2 = document.createElement('td');
    const tiles = document.createElement('div');
    tiles.className = 'tiles';
    const w1 = document.createElement('div');
    w1.className = 'tilewrap';
    w1.appendChild(tile(s, scale));
    w1.insertAdjacentHTML('beforeend', `<small>${72 * scale}px</small>`);
    tiles.appendChild(w1);
    if (scale === 1) { // always offer a 4x reference next to true size
      const w2 = document.createElement('div');
      w2.className = 'tilewrap';
      w2.appendChild(tile(s, 4));
      w2.insertAdjacentHTML('beforeend', '<small>4&times; reference</small>');
      tiles.appendChild(w2);
    }
    td2.appendChild(tiles);
    tr.append(td1, td2);
    t.appendChild(tr);
  }
  applyFX();
}

/* glance test: 200 ms exposure of one random scenario, then gone. */
$('glanceBtn').onclick = () => {
  const s = SCENARIOS[Math.floor(Math.random() * SCENARIOS.length)];
  const host = $('glanceHost');
  host.innerHTML = '';
  host.appendChild(tile(s, 1));
  const overlay = $('glance');
  overlay.style.display = 'flex';
  applyFX();
  setTimeout(() => { host.innerHTML = ''; }, 200);
  const close = () => { overlay.style.display = 'none'; document.removeEventListener('keydown', close); };
  setTimeout(() => document.addEventListener('keydown', close), 50);
};

/* switcher */
function go(delta) {
  variant = KEYS[(KEYS.indexOf(variant) + delta + KEYS.length) % KEYS.length];
  const u = new URL(location.href);
  u.searchParams.set('variant', variant);
  history.replaceState(null, '', u);
  render();
}
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if ($('glance').style.display === 'flex') return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
['zoom','deckctx'].forEach(id => $(id).onchange = render);
$('session').oninput = () => { SESSION = $('session').value || 'default'; render(); };
['blur','cvd','gray'].forEach(id => $(id).oninput = applyFX);
['cvd','gray'].forEach(id => $(id).onchange = applyFX);

render();
</script>
</body>
</html>
